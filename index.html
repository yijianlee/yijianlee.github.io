<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的主页</title>
  <meta name="description" content="个人主页">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <main class="wrap">
    <p class="eyebrow">Hello</p>
    <h1>我是 <span id="name">你的名字</span></h1>
    <p class="lead">这是一个部署在 GitHub Pages 上的纯静态网站。</p>

    <section class="cards">
      <article class="card">
        <h2>关于我</h2>
        <p>在这里写一段自我介绍。改完文件后重新 commit，网站会自动更新。</p>
      </article>
      <article class="card">
        <h2>项目</h2>
        <p>列出你做过的项目，附上链接。</p>
      </article>
      <article class="card">
        <h2>联系</h2>
        <p>邮箱 / GitHub / 其他社交账号。</p>
      </article>
    </section>

    <footer>
      <p>当前时间：<span id="clock">--:--:--</span></p>
    </footer>
  </main>

  <script src="assets/main.js"></script>
</body>
</html>
